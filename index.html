<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Never Miss a Customer Demo</title>
<meta name="description" content="A 1-minute interactive demo: see how an AI assistant turns a missed call into a booked customer.">
<meta name="theme-color" content="#F5F7FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0F16" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}body:not([data-ready]) .app{visibility:hidden}</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="pres" id="pres"></div>
    <div class="sep"></div>
    <div class="client"><div class="clogo" id="clogo"></div><div class="cname" id="cname"></div></div>
    <div class="grow"></div>
    <button class="icon-btn" id="btnMusic" type="button" aria-pressed="true" title="Background music"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span>Music</span></button>
    <button class="icon-btn" id="btnVoice" type="button" aria-pressed="true" title="Voice-over"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="on-only" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg><span>Voice</span></button>
    <button class="icon-btn hide-sm" id="btnCustom" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Customize</button>
  </header>

  <main class="stage">
    <section class="story" aria-live="polite">
      <div class="kicker" id="kicker"></div>
      <h1 class="say" id="say"></h1>
      <p class="lede" id="lede"></p>
      <div id="action"></div>
      <div class="dots" id="dots"></div>
      <div class="ctrls" id="ctrls" hidden>
        <button class="btn" id="btnBack" type="button">← Back</button>
        <button class="btn" id="btnPause" type="button">Pause</button>
        <button class="btn primary" id="btnNext" type="button">Next →</button>
      </div>
    </section>
    <section class="phonecol">
      <div class="alerts" id="alerts" aria-live="polite"></div>
      <div class="phone"><div class="screen">
        <div class="notch"></div>
        <div class="sbar"><span id="pTime"></span><span>●●● ▮</span></div>
        <div class="ahead" id="pHead"></div>
        <div class="pbody" id="pBody"></div>
      </div></div>
      <div class="who" id="who"></div>
    </section>
  </main>
</div>

<div class="modal" id="welcome" hidden role="dialog" aria-modal="true" aria-labelledby="wH">
  <div class="wcard">
    <div class="wtop"><span class="wtag"><i></i><span id="wTag"></span></span><button class="xbtn" id="wSkip" type="button">Skip</button></div>
    <h2 id="wH"></h2>
    <p id="wSub"></p>
    <ul class="wpts" id="wPts"></ul>
    <div class="wfoot"><button class="play" id="wPlay" type="button"><span class="c"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg></span><span id="wCta"></span></button>
      <span class="wnote"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg><span id="wNote"></span></span></div>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-label="Customize demo" inert>
  <div class="row between"><h3 id="dTitle">Customize</h3><button class="btn" id="btnClose" type="button">Done</button></div>
  <details class="qsec" id="quickSec" open>
    <summary>Quick preview <span>just for this visit</span></summary>
    <p id="modeNote"></p>
    <div class="fld"><label for="inIndQ">Industry</label><div class="picker"><span class="pk-ic" aria-hidden="true"><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.2' stroke-linecap='round'><path d='M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zm9 16-4-4'/></svg></span><input type="text" id="inIndQ" class="pk-in" placeholder="Search: aircon, lawyer, nails…" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="inIndList"><ul class="pk-list" id="inIndList" role="listbox" hidden></ul><input type="hidden" id="inInd"></div></div>
    <div class="fld"><label for="inCur">Currency</label><select id="inCur"></select></div>
    <h4>Presented by</h4>
    <div class="fld"><label for="inPres">Name</label><input type="text" id="inPres"></div>
    <div class="fld"><label for="inPresLogo">Logo (optional)</label><input type="file" id="inPresLogo" accept="image/*"><div class="row wrap"><button class="btn" id="btnPresDefault" type="button">Default logo</button><button class="btn" id="btnPresText" type="button">Name only</button></div></div>
    <h4>Business</h4>
    <div class="fld"><label for="inBiz">Business name</label><input type="text" id="inBiz"></div>
    <div class="fld"><label for="inLogo">Logo</label><div class="row wrap"><input type="file" id="inLogo" accept="image/*"><button class="btn" id="btnNoLogo" type="button">Remove</button></div></div>
    <div class="fld"><label for="inColor">Brand colour</label><div class="sw" id="swatches"><input type="color" id="inColor"></div></div>
    <button class="btn" id="btnReset" type="button">Reset</button>
  </details>
</aside>
<audio id="voice" preload="auto" hidden></audio>
<script type="module" src="/src/player/main.ts"></script>
</body>
</html>
